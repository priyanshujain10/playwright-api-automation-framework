name: E-Commerce API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run nightly regression at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - staging
      test_suite:
        description: 'Test suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression
          - all
      browser:
        description: 'Browser to run Playwright tests'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit

jobs:
  api-tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ github.event.inputs.browser || 'chromium' }}
      
      - name: Run smoke tests
        if: ${{ github.event.inputs.test_suite == 'smoke' || github.event_name == 'pull_request' }}
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'qa' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
        run: npm run test:smoke
      
      - name: Run regression tests
        if: ${{ github.event.inputs.test_suite == 'regression' || github.event_name == 'schedule' }}
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'qa' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
        run: npm run test:regression
      
      - name: Run all tests
        if: ${{ github.event.inputs.test_suite == 'all' }}
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'qa' }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          API_KEY: ${{ secrets.API_KEY }}
        run: npm test
      
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: playwright-report
          path: reports/html-report/
          retention-days: 30
      
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-results
          path: reports/allure-results/
          retention-days: 30
      
      - name: Generate Allure report
        if: always()
        run: npm run allure:generate
      
      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30
      
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: reports/test-results/*.xml