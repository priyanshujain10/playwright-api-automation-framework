# ─────────────────────────────────────────────────────────────────────────────
# Post-Deployment Smoke Verification
#
# Purpose  : Immediately after any deployment, verify that the live environment
#            is healthy by running the @Smoke suite. This is the production
#            canary — it confirms the deployment did not break critical paths.
#
# Trigger  : Exclusively manual (workflow_dispatch). This workflow is invoked
#            by the deployment pipeline (or an operator) after a successful
#            deploy to Staging or Production.
#
# Strategy : Run @Smoke tests only (fast, targeted, < 5 min).
#            On failure: alert immediately — do NOT wait for nightly.
#            On success: write a signed-off summary suitable for the release log.
#
# Ownership: The QA / DevOps team should invoke this workflow as the final
#            step in every deployment pipeline via the GitHub API or
#            the "Run workflow" button before declaring the release live.
# ─────────────────────────────────────────────────────────────────────────────

name: "Post-Deployment Smoke"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment that was just deployed"
        required: true
        type: choice
        options:
          - stg
          - prod
      release_version:
        description: "Version / build tag that was deployed (e.g. v2.5.0)"
        required: true
        type: string
      deployed_by:
        description: "Name or team that triggered the deployment"
        required: false
        default: "CI/CD Pipeline"
        type: string

# Only one post-deploy verification per environment at a time.
concurrency:
  group: post-deploy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  checks: write

env:
  NODE_VERSION: "20.x"

jobs:
  # ─── Smoke Verification ────────────────────────────────────────────────────
  post-deploy-smoke:
    name: "Smoke Verification — ${{ github.event.inputs.environment }} (${{ github.event.inputs.release_version }})"
    runs-on: ubuntu-latest
    # Bind to a GitHub Environment so environment-specific secrets and
    # protection rules (e.g. IP allow-lists) are enforced automatically.
    environment: ${{ github.event.inputs.environment }}
    outputs:
      total: ${{ steps.results.outputs.total }}
      passed: ${{ steps.results.outputs.passed }}
      failed: ${{ steps.results.outputs.failed }}
      pass_rate: ${{ steps.results.outputs.pass_rate }}
      gate_status: ${{ steps.results.outputs.gate_status }}

    env:
      TARGET_ENV: ${{ github.event.inputs.environment }}
      # Secrets are resolved at runtime from the bound GitHub Environment.
      # For 'stg': secrets.STG_API_TOKEN etc.  For 'prod': secrets.PROD_API_TOKEN etc.
      # GitHub does not allow dynamic secret names in YAML — we resolve them here.
      API_TOKEN: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_API_TOKEN || secrets.STG_API_TOKEN }}
      API_KEY: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_API_KEY || secrets.STG_API_KEY }}
      TEST_USER_EMAIL: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_TEST_USER_EMAIL || secrets.STG_TEST_USER_EMAIL }}
      TEST_USER_PASSWORD: ${{ github.event.inputs.environment == 'prod' && secrets.PROD_TEST_USER_PASSWORD || secrets.STG_TEST_USER_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: "Run @Smoke tests against ${{ github.event.inputs.environment }}"
        run: npm run test:smoke

      - name: Parse results & evaluate gate
        id: results
        if: always()
        run: |
          python3 - <<'PYEOF'
          import xml.etree.ElementTree as ET, sys, os

          junit_path = "reports/test-results/junit-results.xml"
          if not os.path.exists(junit_path):
              print("::error::JUnit results not found.")
              sys.exit(1)

          root = ET.parse(junit_path).getroot()
          suites = root.findall(".//testsuite") or [root]

          total = failures = errors = skipped = 0
          for s in suites:
              total    += int(s.get("tests",    0))
              failures += int(s.get("failures", 0))
              errors   += int(s.get("errors",   0))
              skipped  += int(s.get("skipped",  0))

          bad    = failures + errors
          passed = total - bad - skipped
          rate   = (passed / total * 100) if total > 0 else 0.0
          status = "PASSED" if bad == 0 else "FAILED"

          env_file = os.environ.get("GITHUB_OUTPUT", "")
          if env_file:
              with open(env_file, "a") as f:
                  f.write(f"total={total}\npassed={passed}\nfailed={bad}\n"
                          f"pass_rate={rate:.2f}\ngate_status={status}\n")

          print(f"Total: {total} | Passed: {passed} | Failed: {bad} | Rate: {rate:.2f}% | Status: {status}")

          if bad > 0:
              print(f"::error::Post-deploy smoke gate FAILED — {bad} critical test(s) failed on "
                    f"{os.environ.get('TARGET_ENV','?')} after deploying "
                    f"{os.environ.get('RELEASE_VERSION','?')}. "
                    "IMMEDIATE ATTENTION REQUIRED — consider rollback.")
              sys.exit(1)
          PYEOF
        env:
          RELEASE_VERSION: ${{ github.event.inputs.release_version }}

      - name: Write deployment verification summary
        if: always()
        run: |
          ENV="${{ github.event.inputs.environment }}"
          VERSION="${{ github.event.inputs.release_version }}"
          DEPLOYED_BY="${{ github.event.inputs.deployed_by }}"
          GATE="${{ steps.results.outputs.gate_status }}"
          TOTAL="${{ steps.results.outputs.total }}"
          PASSED="${{ steps.results.outputs.passed }}"
          FAILED="${{ steps.results.outputs.failed }}"
          RATE="${{ steps.results.outputs.pass_rate }}"
          TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')

          if [[ "$GATE" == "PASSED" ]]; then
            DECISION="✅ DEPLOYMENT VERIFIED"
            ICON="🟢"
          else
            DECISION="🚨 DEPLOYMENT VERIFICATION FAILED — CONSIDER ROLLBACK"
            ICON="🔴"
          fi

          cat >> $GITHUB_STEP_SUMMARY <<SUMMARY
          # ${ICON} Post-Deployment Smoke Report

          **${DECISION}**

          | Field            | Value           |
          |------------------|----------------|
          | Environment      | \`${ENV}\`       |
          | Release Version  | \`${VERSION}\`   |
          | Deployed By      | ${DEPLOYED_BY}  |
          | Verified By      | @${{ github.actor }} |
          | Verification Time | ${TIMESTAMP}   |

          ## Smoke Test Results

          | Metric      | Value         |
          |-------------|--------------|
          | Total Tests | ${TOTAL}      |
          | ✅ Passed   | ${PASSED}     |
          | ❌ Failed   | ${FAILED}     |
          | Pass Rate   | **${RATE}%**  |
          | Required    | **100%**      |

          ---
          > _This report serves as the deployment sign-off artifact. Archive with the release record._
          SUMMARY

      - name: Upload smoke verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Artifact name encodes env + version for easy identification.
          name: post-deploy-smoke-${{ github.event.inputs.environment }}-${{ github.event.inputs.release_version }}-run${{ github.run_number }}
          path: |
            reports/html-report/
            reports/test-results/junit-results.xml
            reports/allure-results/
            reports/logs/
          # Keep post-deploy artifacts longer — they serve as audit trail.
          retention-days: 90
